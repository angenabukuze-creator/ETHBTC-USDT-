        <option value="TG|+228">🇹🇬 Togo (+228)</option>
        <option value="GA|+241">🇬🇦 Gabon (+241)</option>
        <option value="RW|+250">🇷🇼 Rwanda (+250)</option>

  ETHBTC-USDT · Espace membre

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "VOTRE_SUPABASE_URL";
const SUPABASE_KEY = "VOTRE_CLE_PUBLIQUE";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("VOTRE_") &&
  !SUPABASE_KEY.includes("VOTRE_");

let db = null;

if (configured) {
  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
}

const $ = id => document.getElementById(id);

function message(text, error = false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#ff9b91" : "#a9e6ae";
}

function showLogin() {
  $("register").hidden = true;
  $("login").hidden = false;
  $("dashboard").hidden = true;
  message("");
}

function showRegister() {
  $("register").hidden = false;
  $("login").hidden = true;
  $("dashboard").hidden = true;
  message("");
}

function phoneNumber(countryId, phoneId) {
  const [, dial] = $(countryId).value.split("|");
  let digits = $(phoneId).value.replace(/\D/g, "");

  // Accepte aussi un numéro saisi avec l'indicatif.
  if (digits.startsWith(dial.slice(1))) {
    digits = digits.slice(dial.length - 1);
  }

  if (!digits) {
    throw new Error("Entrez votre numéro de téléphone.");
  }

  return dial + digits;
}

function friendlyError(error) {
  const text = error.message || "Une erreur est survenue.";

  if (/already registered|already exists/i.test(text)) {
    return "Ce numéro possède déjà un compte.";
  }

  if (/invalid login credentials/i.test(text)) {
    return "Numéro ou mot de passe incorrect.";
  }

  if (/phone.*confirm|confirmation/i.test(text)) {
    return "La confirmation du téléphone est encore requise dans Supabase.";
  }

  return text;
}

async function saveProfile(user, details) {
  if (!user || !db) return;

  const { error } = await db.from("profiles").upsert({
    id: user.id,
    full_name: details.full_name,
    phone: user.phone || details.phone,
    country_code: details.country_code,
    country_name: details.country_name
  }, { onConflict: "id" });

  if (error) {
    console.error("Profil non enregistré :", error.message);
  }
}

function showDashboard(user) {
  $("register").hidden = true;
  $("login").hidden = true;
  $("dashboard").hidden = false;

  $("welcome").textContent =
    "Connecté : " + (user.phone || "membre");

  message("");
}

$("registerForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db) {
    return message("Configurez d'abord l'URL et la clé publique Supabase.", true);
  }

  const button = $("registerButton");
  button.disabled = true;

  try {
    const fullName = $("fullname").value.trim();
    const password = $("password").value;
    const password2 = $("password2").value;

    if (password !== password2) {
      throw new Error("Les deux mots de passe ne correspondent pas.");
    }

    if (password.length < 8) {
      throw new Error("Le mot de passe doit contenir au moins 8 caractères.");
    }

    const [countryCode] = $("country").value.split("|");
    const countryName = $("country").selectedOptions[0].textContent;
    const phone = phoneNumber("country", "phone");

    message("Création du compte en cours...");

    const { data, error } = await db.auth.signUp({
      phone,
      password,
      options: {
        data: {
          full_name: fullName,
          country_code: countryCode,
          country_name: countryName
        }
      }
    });

    if (error) throw error;

    if (data.session && data.user) {
      await saveProfile(data.user, {
        full_name: fullName,
        phone,
        country_code: countryCode,
        country_name: countryName
      });

      showDashboard(data.user);
    } else {
      message(
        "Supabase a créé la demande, mais aucune session n'a été ouverte. Vérifiez la configuration de confirmation du téléphone.",
        true
      );
    }
  } catch (error) {
    message(friendlyError(error), true);
  } finally {
    button.disabled = false;
  }
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!db) {
    return message("Configurez d'abord Supabase.", true);
  }

  const button = $("loginButton");
  button.disabled = true;

  try {
    const phone = phoneNumber("loginCountry", "loginPhone");
    const password = $("loginPassword").value;

    const { data, error } = await db.auth.signInWithPassword({
      phone,
      password
    });

    if (error) throw error;

    showDashboard(data.user);
  } catch (error) {
    message(friendlyError(error), true);
  } finally {
    button.disabled = false;
  }
});

async function logout() {
  if (!db) return;

  const { error } = await db.auth.signOut();

  if (error) {
    return message(friendlyError(error), true);
  }

  showRegister();
  message("Vous êtes déconnecté.");
}

async function restoreSession() {
  if (!db) return;

  const { data } = await db.auth.getSession();

  if (data.session) {
    showDashboard(data.session.user);
  }
}

restoreSession();
</script>

</body>
</html>
